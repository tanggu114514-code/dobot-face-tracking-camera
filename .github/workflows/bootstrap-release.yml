name: Import release source

on:
  push:
    paths:
      - release-source.zip

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified release
        run: |
          unzip -o release-source.zip
          rm release-source.zip
          rm -f .github/workflows/bootstrap-release.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete release source"
          git push origin main
